name: Issue Auto-Fix after Approval (OpenHands on Z4Pro)

# 只有在人工打上 ai-approve 标签后才会走到这里。
# 前置的分析报告（/opt/oh-logs/reports/issue-<n>.json）会被注入编码 agent 的 prompt，
# 让它直接照着已批准的方案改，而不是从零重新探索。
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "要修复的 Issue 编号 (例如: 12)"
        required: true
        type: string

concurrency:
  group: oh-issue-fix-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: OpenHands Automated Issue Resolution
    runs-on: [self-hosted, Linux, X64, z4pro, openhands]
    timeout-minutes: 75
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
      # 修复链只认 ai-approve —— 人工批准的唯一入口
      OH_STAGE_KIND: fix
      OH_GATE_LABELS: ai-approve
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - name: 1. 审批闸门 (校验 ai-approve / 幂等 / 频控 / 读报告)
        id: gate
        run: python3 -B /opt/oh-config/oh_workflow_steps.py gate_approve

      - name: 2. 前置意图分类 (Triage)
        id: triage
        if: steps.gate.outputs.proceed == 'true'
        run: python3 -B /opt/oh-config/oh_workflow_steps.py triage

      - name: 3. 检出代码与创建分支 (oh/issue-<n>)
        if: steps.gate.outputs.proceed == 'true' && steps.triage.outputs.should_code == 'true'
        run: python3 -B /opt/oh-config/oh_workflow_steps.py checkout

      - name: 4. OpenHands 零凭证隔离沙箱定位与修复
        id: openhands
        if: steps.gate.outputs.proceed == 'true' && steps.triage.outputs.should_code == 'true'
        run: python3 -B /opt/oh-config/oh_workflow_steps.py openhands

      - name: 5. 宿主机三道 Guard 安全与测试审计
        id: guard
        if: steps.gate.outputs.proceed == 'true' && steps.triage.outputs.should_code == 'true'
        run: python3 -B /opt/oh-config/oh_workflow_steps.py guard

      - name: 6. 推送分支、开 PR 并轮询 Checks 自动合入
        id: pr_merge
        if: steps.gate.outputs.proceed == 'true' && steps.triage.outputs.should_code == 'true' && steps.guard.outputs.guard_result == 'passed'
        run: python3 -B /opt/oh-config/oh_workflow_steps.py pr_merge

      - name: 7. 主干合并后冒烟测试与失败自动 Revert
        id: smoke
        if: steps.gate.outputs.proceed == 'true' && steps.pr_merge.outputs.merged == 'true'
        run: python3 -B /opt/oh-config/oh_workflow_steps.py smoke

      - name: 8. 写入观测记录 (JSONL + Step Summary)
        if: always()
        run: python3 -B /opt/oh-config/oh_workflow_steps.py observe
