# 仓库 issue 入口配置 / Issue entry configuration
# 放到 .github/ISSUE_TEMPLATE/config.yml 后提交即生效。
# 作用：关掉「空白 issue」，只留结构化表单 + 讨论区入口。
# Purpose: disable blank issues; leave one structured form plus a Discussions door.

blank_issues_enabled: false

contact_links:
  - name: 报一个 Bug / Report a bug
    url: https://github.com/DC1024/rolecard-studio/issues/new?template=bug-report.yml
    about: 三个必填框，约 30 秒。说清「点了什么、看到什么」就够了。/ Three required fields, about 30 seconds. Just say what you clicked and what you saw.

  - name: 用法疑问 / 想法 · Questions & ideas
    url: https://github.com/DC1024/rolecard-studio/discussions
    about: 「怎么用 X」「能不能支持 Y」请到讨论区；issue 只收「本该正常却没正常工作」的问题。/ "How do I…" and "Could you add…" belong in Discussions — issues are for things that should work but don't.
